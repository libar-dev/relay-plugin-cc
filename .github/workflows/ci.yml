name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        node: [22, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Check types
        run: npm run check

      # The plugin's hooks module runs only inside Claude Code, so its checks need the CLI. Neither
      # command signs in. The version is pinned so a new release cannot change a run's result.
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.308

      - name: Validate plugin
        run: claude plugin validate plugins/relay

      - name: Run Mod tests
        run: claude plugin test plugins/relay
